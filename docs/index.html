*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0}
.sub{color:var(--ink2);font-size:13px;margin:4px 0 20px}
h2{font-size:15px;margin:0 0 4px}
.sub2{color:var(--ink2);font-size:12px;font-weight:600;margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:16px;min-width:0}
.section{margin-top:16px}
.label{color:var(--ink2);font-size:13px}
.big{font-size:32px;font-weight:650;letter-spacing:-.01em}
.small{color:var(--muted);font-size:12px}
.delta{font-size:12px;margin-top:4px;color:var(--goodtx)}
.delta.none{color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:4px}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:8px 0 6px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.sw{width:10px;height:10px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--axis);white-space:nowrap}
th[data-k]{cursor:pointer}
td{padding:6px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;vertical-align:top}
td.num,th.num{text-align:right}
tr.grp td{color:var(--ink2);font-weight:600;font-size:12px;padding-top:14px;border-bottom:1px solid var(--axis)}
tr.idle td{color:var(--muted)}
.stack{display:inline-flex;gap:2px;width:140px;height:8px;vertical-align:middle;margin-right:6px}
.stack>span{display:block;height:100%}

.spark{vertical-align:middle;margin-right:6px}
.gain{display:inline-block;min-width:64px;text-align:right}
.tag{font-size:11px;color:var(--ink2);border:1px solid var(--axis);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>.card{margin-top:0}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:6px;padding:6px 8px;
font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;max-width:340px;z-index:5}
.tip .key{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:6px}
.empty{color:var(--muted);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.ctlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 12px}
.scale{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.scale button{font:inherit;font-size:12px;background:transparent;color:var(--ink2);border:0;padding:4px 10px;cursor:pointer}
.scale button+button{border-left:1px solid var(--axis)}
.scale button[aria-pressed="true"]{background:var(--track);color:var(--ink);font-weight:600}
.wrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{font:inherit;font-size:12px;border:1px solid var(--grid);background:transparent;color:var(--ink2);border-radius:999px;padding:2px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--axis);background:var(--track)}
details summary{cursor:pointer;color:var(--ink2);font-size:12px;font-weight:600;margin:16px 0 8px}
code{font-size:12px}
#map svg{display:block;touch-action:manipulation}
#map rect.m{fill:var(--s1)}#map rect.p{fill:var(--warn)}#map rect.t{fill:var(--todo)}
#map .cl{font-size:11px;pointer-events:none}#map .cl.m{fill:#fff}#map .cl.p{fill:#0b0b0b}#map .cl.t{fill:var(--ink2)}
#map .ul{fill:var(--ink2);font-weight:600;cursor:pointer}
#map .ul.z{cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--grid);border-radius:999px;padding:2px 10px}
.pill i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot{margin-right:6px;vertical-align:middle}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;margin:14px 0 4px}
.mv{font-size:18px;font-weight:600}
.counts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:14px 0 6px}
.cv{font-size:20px;font-weight:600}
.notice{margin:12px 0 0;padding:8px 10px;border:1px solid var(--axis);border-radius:8px;font-size:13px;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice button{font:inherit;font-size:12px;border:1px solid var(--axis);background:var(--track);color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.gate{margin-top:8px}
.log{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2);overflow-wrap:anywhere}
.log .lt{color:var(--muted);margin-right:8px}

.park .note{font-size:13px;color:var(--ink2);margin:0 0 10px;white-space:pre-wrap}

// squarified treemap (Bruls, Huizing and van Wijk): vals largest first; [x, y, w, h] per value
function squarify(vals,x,y,w,h){
 const out=new Array(vals.length),total=vals.reduce((a,b)=>a+b,0);
 if(!total||w<=0||h<=0){out.fill([x,y,0,0]);return out}
 const scale=w*h/total;let i=0;
 while(i<vals.length){
  const side=Math.min(w,h);let j=i,sum=0,best=Infinity,lo=Infinity,hi=0;
  while(j<vals.length){const a=vals[j]*scale,s=sum+a,l=Math.min(lo,a),m=Math.max(hi,a);
   const worst=Math.max(side*side*m/(s*s),s*s/(side*side*l));if(worst>best)break;
   best=worst;sum=s;lo=l;hi=m;j++}
  const thick=sum/side;
  if(w>=h){let yy=y;for(let k=i;k<j;k++){const len=vals[k]*scale/thick;out[k]=[x,yy,thick,len];yy+=len}x+=thick;w-=thick}
  else{let xx=x;for(let k=i;k<j;k++){const len=vals[k]*scale/thick;out[k]=[xx,y,len,thick];xx+=len}y+=thick;h-=thick}
  i=j}
 return out}

let rt,lastW=document.documentElement.clientWidth;
addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=document.documentElement.clientWidth;if(w!=lastW){lastW=w;drawTime();drawMap()}},150)});

// ---------------------------------------------------------------- swarm (live)
// docs/swarm.js is written by tools/swarm/swarm.mjs during a run and is git-ignored, so GitHub
// Pages has none and the card stays hidden. A file:// page can't fetch JSON, so it comes as a
// script that calls swarmStatus(): every 5 s while a run is on, every minute otherwise.
const SW={last:null,timer:null,misses:0};
const MIDX=new Map(M.fn.map(f=>[f.seg+"|"+f.name,f.st]));
const OUT={matched:["Matched","var(--good)"],failed:["Failed","var(--bad)"],infra:["Environment error","var(--bad)"],error:["Error","var(--bad)"],
 conflict:["Conflict","var(--serious)"],"gate-refused":["Refused by the gate","var(--serious)"],parked:["Parked","var(--axis)"],
 progress:["Closer (checkpoint)","var(--axis)"],permuted:["Permuter improved it","var(--axis)"],stopped:["Cut short by the stop","var(--axis)"]};
function renderSwarm(st){
 const el=$("swarm"),r=st&&st.run;
 if(!r){el.hidden=true;return}
 el.hidden=false;
 const now=Date.now(),age=now-Date.parse(st.updated),live=r.state=="running",stale=live&&age>120e3;
 const [label,col]=stale?["Not responding","var(--serious)"]:live?(r.stopping?[r.stopping=="now"?"Stopping now":"Stopping after current work","var(--warn)"]:["Running","var(--good)"])
  :r.state=="killed"?["Killed","var(--bad)"]:["Finished","var(--muted)"];
 const t0=Date.parse(r.started),t1=live&&!stale?now:Date.parse(r.ended||st.updated),mins=Math.max(0,(t1-t0)/6e4);
 const pl=r.pool||{},plural=(k,w)=>`${k} ${w}${k==1?"":"s"}`;
 const pool=[plural(pl.workers,"worker"),`${pl.big} big`,plural(pl.permuters,"permuter")].join(", ");
 // matched by the swarm but not matched in this page's data: the page is older than the commits
 const fresh=(st.results||[]).filter(x=>x.outcome=="matched"&&MIDX.has(x.seg+"|"+x.name)&&MIDX.get(x.seg+"|"+x.name)!="m").length;
 const lim=r.limits||{};
 const meter=(name,val,of,p)=>`<div><div class="label">${name}</div><div class="mv">${val}<span class="small"> of ${of}${p>=90?" · near the limit":""}</span></div>`+
  `<div class="bar"><span style="width:${Math.min(100,p).toFixed(1)}%;background:${p>=90?"var(--warn)":"var(--s1)"}"></span></div></div>`;
 const counts=[["Matched",r.stats.matched],["Parked",r.stats.parked],["Failed",r.stats.failed],["Conflicts",r.stats.conflicts],["In the queue",r.queued]]
  .map(([k,v])=>`<div><div class="label">${k}</div><div class="cv">${n(v||0)}</div></div>`).join("");
 const mins1=(m,l)=>m!=null?`${m.toFixed(1)} min${l?`<span class="small"> of ${l}</span>`:""}`:"";
 const slots=(st.slots||[]).map(s=>s.func?`<tr><td>${esc(s.slot)}</td><td><code>${esc(s.func)}</code><div class="small">${esc(s.seg||"")}${s.from?` · from ${esc(s.from)}`:""}</div></td>`+
   `<td class="num">${n(s.size||0)}</td><td class="opt">${esc(s.model||"")}</td><td class="opt">${s.big?`big session ${s.session||1}`:`attempt ${s.attempt||1}`}</td><td class="num">${mins1(s.minutes,s.limit)}</td></tr>`
   :`<tr class="idle"><td>${esc(s.slot)}</td><td colspan="5">idle</td></tr>`).join("")+
  (st.permuters||[]).map(p=>p.func?`<tr><td>${esc(p.slot)}</td><td><code>${esc(p.func)}</code><div class="small">permuter</div></td><td class="num">${p.size?n(p.size):""}</td><td class="opt"></td><td class="opt"></td><td class="num">${mins1(p.minutes,p.limit)}</td></tr>`
   :`<tr class="idle"><td>${esc(p.slot)}</td><td colspan="5">permuter idle</td></tr>`).join("");
 const busy=(st.slots||[]).some(s=>s.func)||(st.permuters||[]).some(p=>p.func);
 const g=st.gate||{},names=a=>a.map(x=>`<code>${esc(x)}</code>`).join(", ");
 const gate=[g.checking&&g.checking.length?`Gate: checking ${names(g.checking)}`:"",g.waiting&&g.waiting.length?`waiting for the gate: ${names(g.waiting)}`:"",
  st.permuteWaiting&&st.permuteWaiting.length?`waiting for a permuter: ${names(st.permuteWaiting)}`:""].filter(Boolean).join(" · ");
 const res=(st.results||[]).slice(0,10).map(x=>{const [l,c]=OUT[x.outcome]||[x.outcome,"var(--axis)"];
  return `<tr><td class="num">${esc(hm(x.at))}</td><td><code>${esc(x.name)}</code> <span class="small">${n(x.size||0)} B</span></td>`+
   `<td><i class="dot" style="background:${c}"></i>${esc(l)} <span class="small">${esc(x.model||"")}</span></td><td class="num">${x.usd!=null?"$"+x.usd.toFixed(2):""}</td></tr>`}).join("");
 const log=(st.log||[]).slice(-8).map(l=>{const m=String(l).match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) (.*)$/);
  return `<div><span class="lt">${m?esc(hm(m[1].replace(" ","T")+"Z")):""}</span>${esc(m?m[2]:l)}</div>`}).join("");
 const runs=(st.runs||[]).slice(0,6).map(x=>{const d=x.ended?(Date.parse(x.ended)-Date.parse(x.started))/6e4:x.id==r.id?mins:null;
  return `<tr><td>${esc(when(x.started))}${x.id==r.id?'<span class="tag">this run</span>':""}</td><td>${esc(x.target)}</td><td class="num">${d!=null?dur(d):"—"}</td>`+
   `<td class="num">${n(x.matched||0)}</td><td class="num opt">${n(x.parked||0)}</td><td class="num">$${(x.usd||0).toFixed(2)}</td><td class="num opt">${x.matched?"$"+(x.usd/x.matched).toFixed(2):"—"}</td></tr>`}).join("");
 el.innerHTML=`<div class="head"><div><h2>Swarm</h2><div class="small">Run ${esc(r.id)}${r.dryRun?" (dry run)":""} · ${esc(r.target)} · ${esc(pool)} · started ${esc(when(r.started))}</div></div>`+
  `<div class="ctl"><span class="pill"><i style="background:${col}"></i>${label}</span><span class="small">${stale?"last update":"updated"} ${ago(age)}</span></div></div>`+
  (fresh?`<div class="notice">${n(fresh)} matched since this page was generated <button type="button" id="reload">Reload</button></div>`:"")+
  `<div class="meters">${meter("Time",dur(mins),dur(lim.minutes||0),pct(mins,lim.minutes))}${meter("Spend","$"+(r.costUsd||0).toFixed(2),"$"+(lim.usd||0),pct(r.costUsd,lim.usd))}`+
  `${meter("Functions leased",n(r.leases||0),n(lim.functions||0),pct(r.leases,lim.functions))}</div><div class="counts">${counts}</div>`+
  (live||busy?`<div class="wrap"><table><tr><th>Slot</th><th>Function</th><th class="num">Bytes</th><th class="opt">Model</th><th class="opt">Session</th><th class="num">Running for</th></tr>${slots}</table></div>`:"")+
  (gate?`<div class="small gate">${gate}</div>`:"")+
  `<div class="two"><div><div class="sub2">This run</div>${res?`<table>${res}</table>`:'<div class="empty">No results yet.</div>'}</div>`+
  `<div><div class="sub2">Log</div><div class="log">${log||'<span class="empty">Nothing logged yet.</span>'}</div></div></div>`+
  (runs?`<div class="sub2">Recent runs</div><div class="wrap"><table><tr><th>Started</th><th>Target</th><th class="num">Took</th><th class="num">Matched</th><th class="num opt">Parked</th><th class="num">Spend</th><th class="num opt">$/match</th></tr>${runs}</table></div>`:"");
 const rb=$("reload");if(rb)rb.onclick=()=>location.reload();
}
window.swarmStatus=st=>{SW.last=st;try{renderSwarm(st)}catch(e){console.error("swarm card:",e)}};
function pollSwarm(){
 const s=document.createElement("script");
 s.src="swarm.js?"+Date.now();
 s.onload=()=>{s.remove();SW.misses=0;nextPoll()};
 s.onerror=()=>{s.remove();SW.misses++;if(!SW.last)$("swarm").hidden=true;nextPoll()};
 document.head.appendChild(s);
}
function nextPoll(){
 clearTimeout(SW.timer);
 // served over http(s) with no swarm.js (GitHub Pages): stop asking
 if(!SW.last&&SW.misses&&location.protocol!="file:")return;
 const live=SW.last&&SW.last.run&&SW.last.run.state=="running";
 SW.timer=setTimeout(pollSwarm,!document.hidden&&live?5e3:60e3);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(SW.last||location.protocol=="file:"))pollSwarm()});
pollSwarm();
</script>
</body>
</html>
