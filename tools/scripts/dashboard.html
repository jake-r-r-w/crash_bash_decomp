<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decomp Progress</title>
<!-- decomp.py progress writes this page to docs/index.html with its data in place of the null after `const D=`.
     docs/swarm.js (git-ignored, written by tools/swarm/swarm.mjs during a run) feeds the live swarm card. -->
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--s1:#2a78d6;--s2:#eb6834;--s3:#1f9e74;--s4:#8a63d2;--track:#ecebe7;--todo:#e1e0d9;--hover:#0b0b0b;--goodtx:#006300;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9d7be0;--track:#2c2c2a;--todo:#353533;
--hover:#f0efec;--goodtx:#0ca30c;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;
--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9d7be0;--track:#2c2c2a;--todo:#353533;--hover:#f0efec;--goodtx:#0ca30c;
color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0}
.sub{color:var(--ink2);font-size:13px;margin:4px 0 20px}
h2{font-size:15px;margin:0 0 4px}
.sub2{color:var(--ink2);font-size:12px;font-weight:600;margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:16px;min-width:0}
.section{margin-top:16px}
.label{color:var(--ink2);font-size:13px}
.big{font-size:32px;font-weight:650;letter-spacing:-.01em}
.small{color:var(--muted);font-size:12px}
.delta{font-size:12px;margin-top:4px;color:var(--goodtx)}
.delta.none{color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:4px}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:8px 0 6px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.sw{width:10px;height:10px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;vertical-align:top}
td.num,th.num{text-align:right}
tr.idle td{color:var(--muted)}
.tag{font-size:11px;color:var(--ink2);border:1px solid var(--axis);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>.card{margin-top:0}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:6px;padding:6px 8px;
font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;max-width:340px;z-index:5}
.tip .key{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:6px}
.empty{color:var(--muted);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.ctlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 12px}
.scale{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.scale button{font:inherit;font-size:12px;background:transparent;color:var(--ink2);border:0;padding:4px 10px;cursor:pointer}
.scale button+button{border-left:1px solid var(--axis)}
.scale button[aria-pressed="true"]{background:var(--track);color:var(--ink);font-weight:600}
.wrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{font:inherit;font-size:12px;border:1px solid var(--grid);background:transparent;color:var(--ink2);border-radius:999px;padding:2px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-color:var(--axis);background:var(--track)}
details summary{cursor:pointer;color:var(--ink2);font-size:12px;font-weight:600;margin:16px 0 8px}
code{font-size:12px}
#map svg{display:block;touch-action:manipulation}
#map rect.m{fill:var(--s1)}#map rect.p{fill:var(--warn)}#map rect.n{fill:var(--s3)}#map rect.c{fill:var(--s4)}
#map rect.t,#map rect.u,#map rect.a{fill:var(--todo)}
#map .cl{font-size:11px;pointer-events:none}#map .cl.m,#map .cl.n,#map .cl.c{fill:#fff}#map .cl.p{fill:#0b0b0b}
#map .cl.t,#map .cl.u,#map .cl.a{fill:var(--ink2)}
#map .ul{fill:var(--ink2);font-weight:600;cursor:pointer}
#map .ul.z{cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--grid);border-radius:999px;padding:2px 10px}
.pill i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot{margin-right:6px;vertical-align:middle}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;margin:14px 0 4px}
.mv{font-size:18px;font-weight:600}
.counts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:14px 0 6px}
.cv{font-size:20px;font-weight:600}
.notice{margin:12px 0 0;padding:8px 10px;border:1px solid var(--axis);border-radius:8px;font-size:13px;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice button{font:inherit;font-size:12px;border:1px solid var(--axis);background:var(--track);color:var(--ink);border-radius:6px;padding:2px 10px;cursor:pointer}
.gate{margin-top:8px}
.log{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2);overflow-wrap:anywhere}
.log .lt{color:var(--muted);margin-right:8px}
@media (max-width:760px){.two{grid-template-columns:1fr}.opt{display:none}}
</style>
</head>
<body>
<main>
<div class="head"><div><h1 id="title">Decomp progress</h1><div class="sub" id="sub"></div></div>
<div class="scale" id="theme" role="group" aria-label="Theme"></div></div>
<div class="tiles" id="tiles"></div>
<div class="ctlrow"><span class="label">Show</span><div class="scale" id="measure" role="group" aria-label="Measure"></div>
<span class="label">by</span><div class="scale" id="scale" role="group" aria-label="Time scale"></div></div>
<section class="card"><h2>Progress over time</h2><div class="legend" id="legend"></div><div id="chart"></div>
<div class="sub2" id="pace-title">Matched per day</div><div id="pace"></div>
<details id="tbl"><summary>Show as a table</summary><div class="wrap"><table id="htable"></table></div></details></section>
<section class="card section"><div class="head"><h2>Map</h2><div class="scale" id="mmode" role="group" aria-label="What the map shows"></div></div>
<div class="legend" id="mlegend"></div>
<div class="small" id="mcap"></div><div class="chips" id="mchips" role="group" aria-label="Unit shown in the map"></div>
<div id="map"></div><div class="sub2" id="left-title">Largest functions left</div><div class="wrap"><table id="left"></table></div></section>
<section class="card section" id="swarm" hidden aria-label="Swarm status"></section>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const D=/*DATA*/null;
// theme: Auto follows the OS; Light/Dark set data-theme on <html> (the CSS handles both)
(function(){
 const el=document.getElementById("theme"),root=document.documentElement;
 let t=null;try{t=localStorage.getItem("decomp-theme")}catch(e){}
 function set(v){t=v;if(v=="auto")root.removeAttribute("data-theme");else root.setAttribute("data-theme",v);
  try{localStorage.setItem("decomp-theme",v)}catch(e){}
  el.innerHTML=[["auto","Auto"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button data-t="${k}" aria-pressed="${k==t}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.t))}
 set(["light","dark"].includes(t)?t:"auto");
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(a,b)=>b?100*a/b:0, f2=x=>x.toFixed(2)+"%", f1=x=>x.toFixed(1)+"%", n=x=>Math.round(x).toLocaleString();
const kb=b=>b>=1e6?(b/1e6).toFixed(2)+" MB":b>=1e4?(b/1e3).toFixed(1)+" KB":n(b)+" B";
const compact=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1)+"M":v>=1e3?(v/1e3).toFixed(v>=1e4?0:1)+"K":Number.isInteger(v)?String(v):v.toFixed(1);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const when=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})};
const hm=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})};
const dur=m=>m<1?"<1 min":m<60?Math.round(m)+" min":Math.floor(m/60)+" h"+(Math.round(m%60)?" "+Math.round(m%60)+" min":"");
const ago=ms=>ms<10e3?"just now":ms<60e3?Math.round(ms/1e3)+" s ago":ms<36e5?Math.round(ms/6e4)+" min ago":ms<864e5?dur(ms/6e4)+" ago":Math.round(ms/864e5)+" days ago";
const S=D.summary, GEN=Date.parse(D.generated);
$("title").textContent=(D.game||"Game")+" decomp progress";
$("sub").textContent="Updated "+D.generated.replace("T"," ").replace("Z"," UTC")+(D.commit?" · commit "+D.commit:"");

const tip=$("tip");
function showTip(html,ev){tip.innerHTML=html;tip.style.display="block";
 const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;
 if(x+r.width>innerWidth-8)x=Math.max(8,ev.clientX-14-r.width);
 if(y+r.height>innerHeight-8)y=Math.max(8,ev.clientY-14-r.height);
 tip.style.left=x+"px";tip.style.top=y+"px"}
const hideTip=()=>{tip.style.display="none"};

// ---------------------------------------------------------------- data
// history: columns (t: seconds since the point before), made dense here
const P=[];
(function(){
 const h=D.hist||{t:[]};let t=0;
 for(let i=0;i<h.t.length;i++){t+=h.t[i];P.push({t:t*1e3,game_b:h.game_b[i],game_f:h.game_f[i],named_f:h.named_f[i],data_b:h.data_b[i]})}
})();
const at=(i,k)=>i<0?0:P[i][k];
// the maps: every game function (or data block) with its file, unit, size and a status letter;
// done is the letter that counts as finished (u.m: its bytes per unit)
function mapData(m,stOf,done){
 const out={fn:[],units:{}};let i=0;
 for(const [seg,unit,count] of m.segs)for(let k=0;k<count;k++,i++){
  const f={i,name:m.n[i],size:m.s[i],st:stOf(m,i),seg,unit};out.fn.push(f);
  const u=out.units[unit]||(out.units[unit]={unit,fns:[],b:0,m:0,segs:[]});
  u.fns.push(f);u.b+=f.size;if(f.st==done)u.m+=f.size;
  if(u.segs[u.segs.length-1]!=seg)u.segs.push(seg)}
 return out}
const EMPTY={segs:[],n:[],s:[],t:"",nm:""};
// code: m matched, p parked, t to do; named: n real name, u placeholder; data: c in C, a still asm
const MODES={
 code:{label:"Game code",done:"m",M:mapData(D.map||EMPTY,(m,i)=>m.t[i],"m"),what:"Function",verb:"matched",
  st:{m:["Matched","var(--s1)"],p:["Parked","var(--warn)"],t:["Not matched yet","var(--todo)"]},
  cap:"Every game function as a cell sized by its bytes; PsyQ (Sony's objects) is left out.",
  left:"Largest functions left",none:"Nothing left to match here."},
 named:{label:"Functions named",done:"n",M:mapData(D.map||EMPTY,(m,i)=>(m.nm||"")[i]=="1"?"n":"u","n"),what:"Function",verb:"named",
  st:{n:["Named","var(--s3)"],u:["Placeholder name (func_…)","var(--todo)"]},
  cap:"Every game function as a cell sized by its bytes, coloured by whether it has a real name.",
  left:"Largest functions still unnamed",none:"Every function here is named."},
 data:{label:"Data in C",done:"c",M:mapData(D.dmap||EMPTY,(m,i)=>m.t[i],"c"),what:"Data block",verb:"in C",
  st:{c:["In C","var(--s4)"],a:["Still asm","var(--todo)"]},
  cap:"Every data, rodata and bss block as a cell sized by its bytes, cut at splat's labels. The engine's slot image "+
   "(the overlays' load area as the build machine left it, read from the disc) is left out.",
  left:"Largest data blocks still asm",none:"All of the data here is C."},
 dnamed:{label:"Data named",done:"n",M:mapData(D.dmap||EMPTY,(m,i)=>(m.nm||"")[i]=="1"?"n":"u","n"),what:"Data block",verb:"named",
  st:{n:["Named","var(--s3)"],u:["Placeholder name (D_…)","var(--todo)"]},
  cap:"The data map's blocks coloured by whether they have a real name; a C file's data is cut at its objects. "+
   "The compiler's own strings and jump tables count as named.",
  left:"Largest data blocks still unnamed",none:"Every data block here is named."}};
let mode=store.get("decomp-mapmode");if(!MODES[mode])mode="code";
const TITLE=Object.fromEntries((S.units||[]).map(u=>[u.unit,u.title||""]));
const uname=u=>u+(TITLE[u]&&TITLE[u]!=u?` (${TITLE[u]})`:"");

// ---------------------------------------------------------------- tiles
(function(){
 const tile=(label,big,small,p,color,extra)=>`<div class="card"><div class="label">${label}</div><div class="big">${big}</div>
<div class="small">${small}</div>${extra||""}${p==null?"":`<div class="bar"><span style="width:${Math.min(100,p)}%;background:${color}"></span></div>`}</div>`;
 // what the last 7 days to this page's data added
 let wk="";
 if(P.length){
  const ref=GEN-7*864e5;let j=-1;for(let i=0;i<P.length&&P[i].t<=ref;i++)j=i;
  const L=P.length-1,df=P[L].game_f-at(j,"game_f"),db=P[L].game_b-at(j,"game_b");
  const span=j<0?`since ${new Date(P[0].t).toLocaleDateString(undefined,{month:"short",day:"numeric"})}`:"in the last 7 days";
  wk=df>0?`<div class="delta">▲ ${n(df)} functions, ${kb(db)} ${span}</div>`:`<div class="delta none">No new matches ${span}</div>`;
 }
 const G=S.game,named=G.named_f,all=G.all_f,DA=S.data||{done_b:0,total_b:0,pct:0};
 $("tiles").innerHTML=tile("Game code matched",f2(G.pct),`${n(G.done_b)} / ${n(G.total_b)} bytes<br>${n(G.done_f)} / ${n(G.total_f)} functions · ${f2(pct(G.done_f,G.total_f))}`,G.pct,"var(--s1)",wk)+
  tile("Game functions named",f2(pct(named,all)),`${n(named)} / ${n(all)} with a real name`,pct(named,all),"var(--s3)")+
  tile("Data in C",f2(DA.pct),`${n(DA.done_b)} / ${n(DA.total_b)} bytes of data and rodata`+
   (DA.slot_b?`<br>plus the engine's slot image, ${kb(DA.slot_b)} read from the disc, not counted`:""),DA.pct,"var(--s4)");
})();

// ---------------------------------------------------------------- time scale and measure
const MEASURES={bytes:"Bytes",functions:"Functions"};
const UNITS={minute:{label:"Minutes",per:"minute",win:120},hour:{label:"Hours",per:"hour",win:48},day:{label:"Days",per:"day",win:60},
 week:{label:"Weeks",per:"week",win:52},month:{label:"Months",per:"month",win:0}};
let measure=store.get("decomp-measure");if(!MEASURES[measure])measure="bytes";
const fnMode=()=>measure=="functions";
const floor=(t,u)=>{const d=new Date(t);d.setSeconds(0,0);if(u!="minute"){d.setMinutes(0);if(u!="hour"){d.setHours(0);
 if(u=="week")d.setDate(d.getDate()-((d.getDay()+6)%7));if(u=="month")d.setDate(1)}}return d.getTime()};
const step=(t,u,k=1)=>{const d=new Date(t);if(u=="minute")d.setMinutes(d.getMinutes()+k);else if(u=="hour")d.setHours(d.getHours()+k);
 else if(u=="day")d.setDate(d.getDate()+k);else if(u=="week")d.setDate(d.getDate()+7*k);else d.setMonth(d.getMonth()+k);return d.getTime()};
const lab=(t,u)=>{const d=new Date(t);return u=="minute"?d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})
 :u=="hour"?d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})
 :u=="month"?d.toLocaleDateString(undefined,{month:"short",year:"numeric"})
 :(u=="week"?"w/c ":"")+d.toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const autoUnit=()=>{const sp=P.length?Date.now()-P[0].t:0,HR=36e5,DAY=864e5;
 return sp<3*HR?"minute":sp<2*DAY?"hour":sp<60*DAY?"day":sp<365*DAY?"week":"month"};
let unit=store.get("decomp-scale");if(!UNITS[unit])unit=autoUnit();
// buckets of the chosen unit up to now: each holds the index of the last point before its end
// (-1: none yet); before is the state at the window's start, for the first bucket's gain
function buckets(u){
 const last=floor(Date.now(),u),out=[];
 let start=P.length?floor(P[0].t,u):last;
 if(UNITS[u].win)start=Math.max(start,step(last,u,1-UNITS[u].win));
 let j=0,prev=-1;
 while(j<P.length&&P[j].t<start){prev=j;j++}
 const before=prev;
 for(let b=start;b<=last;b=step(b,u)){const end=step(b,u);while(j<P.length&&P[j].t<end){prev=j;j++}out.push({t:b,i:prev})}
 return {out,before};
}
const SERIES=[
 {k:"game",name:"Game code",col:"var(--s1)",v:i=>fnMode()?pct(at(i,"game_f"),S.game.total_f):pct(at(i,"game_b"),S.game.total_b)},
 {k:"named",name:"Game functions named",col:"var(--s3)",v:i=>pct(at(i,"named_f"),S.game.all_f)},
 {k:"data",name:"Data in C",col:"var(--s4)",v:i=>pct(at(i,"data_b"),(S.data||{}).total_b)}];
// every point against today's totals: the code known to exist grew (overlays were indexed later),
// and a percentage of a smaller total would make a line fall when nothing was lost
const pctTick=v=>(v<1?v.toFixed(2):v<10?v.toFixed(1):v.toFixed(0))+"%";
const niceMax=v=>{const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p};
function yAxis(x0,x1,T,ih,ymax,ticks,fmt){let g="";
 for(let i=0;i<=ticks;i++){const v=ymax*i/ticks,yy=(T+ih*(1-i/ticks)).toFixed(1);
  g+=`<line x1="${x0}" x2="${x1}" y1="${yy}" y2="${yy}" stroke="${i?"var(--grid)":"var(--axis)"}" stroke-width="1"/>`+
     `<text x="${x0-6}" y="${+yy+4}" text-anchor="end">${fmt(v)}</text>`}
 return g}
function xAxis(Bk,x,y,iw){let g="";const N=Bk.length,nl=Math.max(1,Math.min(N,Math.floor(iw/110)));
 for(let k=0;k<nl;k++){const i=nl==1?N-1:Math.round(k*(N-1)/(nl-1));
  g+=`<text x="${x(i).toFixed(1)}" y="${y}" text-anchor="${k==0&&nl>1?"start":k==nl-1?"end":"middle"}">${esc(lab(Bk[i].t,unit))}</text>`}
 return g}
const idxAt=(ev,svg,W,L,bw,N)=>{const r=svg.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width;return Math.max(0,Math.min(N-1,Math.floor((mx-L)/bw)))};
const colPath=(x,y,w,h)=>{const r=Math.min(4,w/2,h),f=v=>v.toFixed(1);
 return `M${f(x)},${f(y+h)}V${f(y+r)}Q${f(x)},${f(y)} ${f(x+r)},${f(y)}H${f(x+w-r)}Q${f(x+w)},${f(y)} ${f(x+w)},${f(y+r)}V${f(y+h)}Z`};

// ---------------------------------------------------------------- progress over time
function drawMain(B){
 const el=$("chart"),Bk=B.out,N=Bk.length;
 $("legend").innerHTML=SERIES.map(s=>`<span><i style="background:${s.col}"></i>${s.name}`+
  (s.k=="game"?` (${fnMode()?"functions":"bytes"})`:s.k=="data"?` (bytes${fnMode()?"; data has no functions":""})`:"")+`</span>`).join("");
 if(!P.length){el.innerHTML='<div class="empty">The chart fills in as functions are matched.</div>';return}
 const W=Math.max(300,el.clientWidth||900),Ht=240,L=44,R=16,T=10,iw=W-L-R,ih=Ht-T-28;
 let hi=0;for(const b of Bk)for(const s of SERIES)hi=Math.max(hi,s.v(b.i));

// squarified treemap (Bruls, Huizing and van Wijk): vals largest first; [x, y, w, h] per value
function squarify(vals,x,y,w,h){
 const out=new Array(vals.length),total=vals.reduce((a,b)=>a+b,0);
 if(!total||w<=0||h<=0){out.fill([x,y,0,0]);return out}
 const scale=w*h/total;let i=0;
 while(i<vals.length){
  const side=Math.min(w,h);let j=i,sum=0,best=Infinity,lo=Infinity,hi=0;
  while(j<vals.length){const a=vals[j]*scale,s=sum+a,l=Math.min(lo,a),m=Math.max(hi,a);
   const worst=Math.max(side*side*m/(s*s),s*s/(side*side*l));if(worst>best)break;
   best=worst;sum=s;lo=l;hi=m;j++}
  const thick=sum/side;
  if(w>=h){let yy=y;for(let k=i;k<j;k++){const len=vals[k]*scale/thick;out[k]=[x,yy,thick,len];yy+=len}x+=thick;w-=thick}
  else{let xx=x;for(let k=i;k<j;k++){const len=vals[k]*scale/thick;out[k]=[xx,y,len,thick];xx+=len}y+=thick;h-=thick}
  i=j}
 return out}
const CW=6.3;   // average width of an 11px character, for "does this label fit"

function mapGroup(fns,x,y,w,h,labels,attr){

 const G=1.5;x+=G;y+=G;w-=2*G;h-=2*G;if(w<=1||h<=1)return "";
 let out="",head=0;
 const label=labels&&h>34?labels.find(l=>l.length*CW+6<=w):null;
 if(label){head=16;out+=`<text class="ul${attr?"":" z"}" x="${(x+2).toFixed(1)}" y="${(y+12).toFixed(1)}"${attr||""}>${esc(label)}</text>`}
 const fs=fns.slice().sort((a,b)=>b.size-a.size),rs=squarify(fs.map(f=>f.size),x,y+head,w,h-head);
 for(let k=0;k<fs.length;k++){const [cx,cy,cw,ch]=rs[k],f=fs[k],ins=cw>2&&ch>2?.5:0;
  // a 1px surface gap between cells (the cell drawn half a pixel in on each side)
  out+=`<rect class="${f.st}" x="${(cx+ins).toFixed(1)}" y="${(cy+ins).toFixed(1)}" width="${Math.max(.5,cw-2*ins).toFixed(1)}" height="${Math.max(.5,ch-2*ins).toFixed(1)}" data-i="${f.i}"/>`;
  if(cw>=56&&ch>=16&&f.name.length*CW+8<=cw)out+=`<text class="cl ${f.st}" x="${(cx+4).toFixed(1)}" y="${(cy+12).toFixed(1)}">${esc(f.name)}</text>`}

function pollSwarm(){

 // served over http(s) with no swarm.js (GitHub Pages): stop asking
 if(!SW.last&&SW.misses&&location.protocol!="file:")return;
 const live=SW.last&&SW.last.run&&SW.last.run.state=="running";
 SW.timer=setTimeout(pollSwarm,!document.hidden&&live?5e3:60e3);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(SW.last||location.protocol=="file:"))pollSwarm()});
pollSwarm();
</script>
