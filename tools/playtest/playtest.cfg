# RetroArch settings the playtest appends to the user's own (--appendconfig): the command port it
# reads and writes RAM through, the network RetroPad (player 1 on UDP 55400) it presses Cross on
# for the rules pages, fast-forward with no cap, and no sound.
network_cmd_enable = "true"
network_cmd_port = "55355"
network_remote_enable = "true"
network_remote_enable_user_p1 = "true"
network_remote_base_port = "55400"
fastforward_ratio = "0.000000"
pause_nonactive = "false"
audio_mute_enable = "true"
