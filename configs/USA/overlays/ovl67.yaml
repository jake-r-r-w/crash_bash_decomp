# Minigame slot overlay id 0x67 (first word): CRASHBSH.DAT index entry 0x2CD (sector 0x6C9D),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: ovl67
sha1: 944e98e5e7e7019b78e1a657c94a32118fd74d13
options:
  basename: ovl67
  target_path: disc/ovl67.bin
  elf_path: build/ovl67.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/ovl67.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.ovl67.txt

  undefined_funcs_auto_path: linkers/ovl67_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/ovl67_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl67
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, rodata, overlays/ovl67/ovl67_id]
      - [0x4, .rodata, overlays/ovl67/ovl67]
      - [0xB8, .rodata, overlays/ovl67/800bbdb8]
      - [0x1F0, c, overlays/ovl67/ovl67]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x8B04, c, overlays/ovl67/800bbdb8]   # proven after 35, by 75; its rodata starts with D_800B336C (used by 75, 78, 129)
      - [0x104C0, data, overlays/ovl67/ovl67_data]
  - [0x14438]
