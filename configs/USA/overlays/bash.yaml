# Minigame slot overlay id 0x5D (first word): CRASHBSH.DAT index entry 0x2D8 (sector 0x6DF2),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: bash
sha1: d0d0387d0963759f9a52f91e7619f16de56f9032
options:
  basename: bash
  target_path: disc/bash.bin
  elf_path: build/bash.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/bash.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.bash.txt

  undefined_funcs_auto_path: linkers/bash_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/bash_undefined_syms_auto.txt

  subalign: 1

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: bash
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, .rodata, overlays/bash/bash_id]   # src/overlays/bash/bash_id.c
      - [0x4, .rodata, overlays/bash/bash]
      - [0x480, .rodata, overlays/bash/xtras]
      - [0x764, .rodata, overlays/bash/bahero]
      - [0x784, c, overlays/bash/bash]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x8398, c, overlays/bash/xtras]   # proven after 21 PlotBashPenguin, by 62; fewest call ties at 59
      - [0xCC68, c, overlays/bash/bahero]   # proven after 72, by 80; no call ties 77..80
      - [0xFD50, .data, overlays/bash/bash]          # bash.c's data (tools/scripts/data2c.py)
      # the later files' data, cut where their own objects start (the code that uses them)
      - [0x11404, .data, overlays/bash/xtras]
      - [0x114DC, .data, overlays/bash/bahero]
  - [0x11521]
