# Minigame slot overlay id 0x66 (first word): CRASHBSH.DAT index entry 0x2CE (sector 0x6CC6),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: bonk
sha1: f111975a08684066d50c9b4799e992271736f0af
options:
  basename: bonk
  target_path: disc/bonk.bin
  elf_path: build/bonk.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/bonk.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.bonk.txt

  undefined_funcs_auto_path: linkers/bonk_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/bonk_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: bonk
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, rodata, overlays/bonk/bonk_id]
      - [0x4, .rodata, overlays/bonk/bonk]
      - [0xB0, .rodata, overlays/bonk/bohero]
      - [0xF0, c, overlays/bonk/bonk]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x3C48, c, overlays/bonk/bohero]   # proven after 14, by 50; fewest call ties at 44, 45
      - [0x5FE8, data, overlays/bonk/bonk_data]
  - [0x6CD8]
