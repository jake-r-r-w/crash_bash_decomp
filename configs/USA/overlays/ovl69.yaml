# Minigame slot overlay id 0x69 (first word): CRASHBSH.DAT index entry 0x2D2 (sector 0x6D26),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: ovl69
sha1: d14ad4700257897c4402b8dccd048263ce74dbe9
options:
  basename: ovl69
  target_path: disc/ovl69.bin
  elf_path: build/ovl69.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/ovl69.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.ovl69.txt

  undefined_funcs_auto_path: linkers/ovl69_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/ovl69_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: ovl69
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, rodata, overlays/ovl69/ovl69_id]
      - [0x4, .rodata, overlays/ovl69/ovl69]
      - [0x508, c, overlays/ovl69/ovl69]
      - [0x5254, data, overlays/ovl69/ovl69_data]
  - [0x78B0]
