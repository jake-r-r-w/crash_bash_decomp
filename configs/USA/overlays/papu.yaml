# Minigame slot overlay id 0x5E (first word): CRASHBSH.DAT index entry 0x2D7 (sector 0x6DDB),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: papu
sha1: 848cc443eb6608d2e46b79e1219a08c7106f2040
options:
  basename: papu
  target_path: disc/papu.bin
  elf_path: build/papu.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/papu.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.papu.txt

  undefined_funcs_auto_path: linkers/papu_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/papu_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: papu
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, rodata, overlays/papu/papu_id]
      - [0x4, .rodata, overlays/papu/papu]
      - [0x148, .rodata, overlays/papu/800b87a0]
      - [0x2F8, c, overlays/papu/papu]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x54EC, c, overlays/papu/800b87a0]   # proven after 14 PlotPapuMinion, by 50; fewest call ties at 44..50
      - [0x95E8, data, overlays/papu/papu_data]
      - [0xB680, bin, overlays/papu/papu_tail]
  - [0xB682]
