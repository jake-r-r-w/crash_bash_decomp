# Minigame slot overlay id 0x65 (first word): CRASHBSH.DAT index entry 0x2CF (sector 0x6CD4),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: dino
sha1: 1d2cd8b029c9796641a0f271fc012c57da74017a
options:
  basename: dino
  target_path: disc/dino.bin
  elf_path: build/dino.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/dino.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.dino.txt

  undefined_funcs_auto_path: linkers/dino_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/dino_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: dino
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, .rodata, ps1/dino_id]   # src/ps1/dino_id.c
      - [0x4, .rodata, overlays/dino/dino]
      - [0x124, c, overlays/dino/dino]
      - [0xA228, .data, overlays/dino/dino]   # dino.c's data (tools/scripts/data2c.py)
  - [0xA9D4]
