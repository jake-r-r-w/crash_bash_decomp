# Minigame slot overlay id 0x67 (first word): CRASHBSH.DAT index entry 0x2CD (sector 0x6C9D),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: n2o
sha1: 944e98e5e7e7019b78e1a657c94a32118fd74d13
options:
  basename: n2o
  target_path: disc/n2o.bin
  elf_path: build/n2o.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/n2o.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.n2o.txt

  undefined_funcs_auto_path: linkers/n2o_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/n2o_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: n2o
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, .rodata, overlays/n2o/n2o_id]   # src/overlays/n2o/n2o_id.c
      - [0x4, .rodata, overlays/n2o/n2o]
      - [0xB8, .rodata, overlays/n2o/nox]
      - [0x1F0, c, overlays/n2o/n2o]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x8B04, c, overlays/n2o/nox]   # proven after 35, by 75; its rodata starts with D_800B336C (used by 75, 78, 129)
      - [0x104C0, .data, overlays/n2o/n2o]          # n2o.c's data (tools/scripts/data2c.py)
      # nox.c's data, cut where its own objects start (the code that uses them)
      - [0x111A0, .data, overlays/n2o/nox]
  - [0x14438]
