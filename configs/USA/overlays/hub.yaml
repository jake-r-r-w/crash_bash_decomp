# Minigame slot overlay id 0x6A (first word): CRASHBSH.DAT index entry 0x2D1 (sector 0x6CFC),
# loaded at the shared slot 0x800B32B4. Layout: .rodata (id, strings, jump tables), .text, .data.
name: hub
sha1: 3284b2f1f1426d216ada385a088f4477bd7da8a8
options:
  basename: hub
  target_path: disc/hub.bin
  elf_path: build/hub.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/hub.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt
    - configs/USA/sym.hub.txt

  undefined_funcs_auto_path: linkers/hub_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/hub_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: hub
    type: code
    start: 0x0
    vram: 0x800B32B4
    subsegments:
      # the id word is its own unit: every slot overlay's first-file jump tables are 8-aligned
      # but the id sits at 0x800B32B4 (4 mod 8), so it can't share their object (ARCHITECTURE.md)
      - [0x0, .rodata, ps1/hub_id]   # src/ps1/hub_id.c
      - [0x4, .rodata, overlays/hub/hub]
      - [0x58, .rodata, overlays/hub/hubcore]
      - [0x13E0, c, overlays/hub/hub]
      # later files: starts proven by switch-table parity (ARCHITECTURE.md, Files inside the slot overlays)
      - [0x1BF8, c, overlays/hub/hubcore]   # proven after 2, by 9; fewest call ties at 8; rodata from D_800B330C
      - [0x8D34, .data, overlays/hub/hub]          # hub.c's data (tools/scripts/data2c.py)
      # hubcore.c's data, cut where its own objects start (the code that uses them)
      - [0x901C, .data, overlays/hub/hubcore]
  - [0x14C5C]
