# Engine module: CRASHBSH.DAT index entry 0x3DF (sector 0x8AEB, table at 0x8004E110 in the exe:
# {u32 sector, u32 size}), loaded at 0x80078C90 (most jal targets land on prologues at that base).
# The file also reserves the minigame slot at 0x800B32B4 (offset 0x3A624): it holds a stub with id
# 0x5C and, from offset 0x54000, leftover build-machine memory (leaked headers). Header word 4
# (0x800D7144) is the end of that slot image.
name: engine
sha1: 2a7e5094fb0c5b7e865268820a35dc63822e1149
options:
  basename: engine
  target_path: disc/engine.bin
  elf_path: build/engine.ovl.elf
  base_path: ../../..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: asm/bin

  ld_script_path: linkers/engine.ld
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  gp_value: 0x8006E9EC

  o_as_suffix: False
  use_legacy_include_asm: False

  section_order: [".text", ".data", ".rodata", ".sdata", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.engine.txt

  undefined_funcs_auto_path: linkers/engine_undefined_funcs_auto.txt
  undefined_syms_auto_path: linkers/engine_undefined_syms_auto.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: engine
    type: code
    start: 0x0
    align: 4
    vram: 0x80078C90
    subsegments:
      - [0x0, textbin, overlays/engine/engine_header]   # entry pointers + image end, read by the exe's loader
      - [0x14, c, overlays/engine/engine]
      # file starts proven by switch-table parity (ARCHITECTURE.md, Files inside the engine);
      # each cut is the latest point the rodata, data tables and calls allow in its proven range,
      # given in the comment as "after A, by B"
      - [0x1F90, c, overlays/engine/panel]     # starts after func_800793E8, by Setup_panel (func_8007AC20)
      - [0x619C, c, overlays/engine/pause]     # after Cups_Update (func_8007D9DC), by func_8007F314  (PAUSE.CPP)
      - [0xAA78, c, overlays/engine/heroes]     # after PAUSE.CPP: Jampack's line table ends there
      - [0x155EC, c, overlays/engine/gameflow]    # after func_8008A200 (strings of 175 stay before), by func_8008E27C
      - [0x1A4EC, c, overlays/engine/levelload]    # after func_80090E20 (memcard tables used to 247), by func_80093BE8
      - [0x1D3FC, c, overlays/engine/camera]    # after func_800952F8, by func_8009608C
      # .data: written by the engine; the last word (0x800ADBCC) is followed by 8-byte alignment
      - [0x1F904, data, overlays/engine/engine_data]
      - [0x1FA90, .data, overlays/engine/asttable]   # EngineASTTable, C (src/overlays/engine/asttable.c)
      - [0x202B8, data, overlays/engine/engine_data_2]
      # .rodata: switch tables and strings, one block per file (first jtbl_800ADBD8 .. last ends 0x800AEC58)
      - [0x34F48, .rodata, overlays/engine/engine]
      - [0x34F9C, .rodata, overlays/engine/panel]
      - [0x35120, .rodata, overlays/engine/pause]   # the mode names D_8009AF00 points to (used by 77, 78)
      - [0x352D0, .rodata, overlays/engine/heroes]
      - [0x357D4, .rodata, overlays/engine/gameflow]
      - [0x35F38, .rodata, overlays/engine/levelload]
      - [0x35FA4, .rodata, overlays/engine/camera]
  # The .bss after the rodata: gameflow's D_800AEC58/5C, then ModeTextBuffer (0x800AEC60), where
  # func_800134FC loads the mode's text file. The image holds the build machine's leftovers
  # there, so it stays a memory image read from the disc (ARCHITECTURE.md, The engine's .bss);
  # its own segment, as the slot's, so it is not grouped with the engine's .data.
  - name: engine_bss
    type: code
    start: 0x35FC8
    align: 4
    vram: 0x800AEC58
    subsegments:
      - [0x35FC8, bin, overlays/engine/engine_bss]
  # The minigame slot image the file reserves (vram 0x800B32B4): stub id 0x5C, zeros, then
  # leftover build-machine memory from offset 0x54000 (leaked headers). Its own segment so it
  # is not grouped with the engine's .data.
  - name: engine_slot
    type: code
    start: 0x3A624
    align: 4
    vram: 0x800B32B4
    subsegments:
      - [0x3A624, bin, overlays/engine/engine_slot]
  - [0x5E4B8]
